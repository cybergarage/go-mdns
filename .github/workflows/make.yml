name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'

    - name: Set up golangci-lint
      run: sudo snap install golangci-lint --classic

    # The interoperability tests in mdnstest check the responder with
    # avahi-browse and avahi-resolve, which need avahi-daemon running.
    - name: Set up Avahi
      run: |
        sudo apt-get update
        sudo apt-get install -y avahi-daemon avahi-utils
        sudo systemctl start avahi-daemon
        avahi-browse --all --terminate --parsable --no-db-lookup

    - name: Test
      env:
        # Fail, rather than skip, the Avahi tests if Avahi is not usable.
        GO_MDNS_TEST_REQUIRE: avahi
      run: make test

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: cybergarage/go-mdns
        files: ./mdns-cover.out
      
